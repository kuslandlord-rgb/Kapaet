<style>
:root{font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color:#112419;background:#e8ece9;--bg:#f4f7f3;--surface:#fff;--ink:#112419;--muted:#748078;--line:#e5ebe6;--green:#1fbd6a;--green-dark:#0c8b4a;--green-soft:#eaf8f0}*{box-sizing:border-box}body{margin:0;min-width:320px;min-height:100vh;background:radial-gradient(circle at top,#f7faf8,#e5eae7 65%)}button,input{font:inherit}.app-shell{min-height:100vh;display:grid;place-items:center;padding:20px}.phone{position:relative;width:min(100%,430px);min-height:min(900px,calc(100vh - 40px));background:var(--bg);border-radius:36px;overflow:hidden;box-shadow:0 28px 70px rgba(22,40,29,.12);padding:28px 24px 92px}.onboarding{display:flex;flex-direction:column;padding-bottom:24px}.onboarding section{flex:1}h1{font-size:40px;line-height:1.02;margin:22px 0 10px;letter-spacing:-1.5px}.lead{font-size:16px;line-height:1.45;color:var(--muted);margin:0 0 26px}.caption,.section-label{color:var(--muted);font-size:13px}.card{background:var(--surface);border-radius:22px;padding:18px;box-shadow:0 1px 0 rgba(18,36,25,.02)}.input-card label{display:block;font-size:13px;color:var(--muted);font-weight:600}.amount-input{display:flex;align-items:center;gap:10px;margin-top:8px}.amount-input input{border:0;outline:0;background:transparent;font-size:34px;font-weight:800;min-width:0;width:100%;color:var(--ink)}.amount-input span{background:var(--green-soft);color:var(--green-dark);font-weight:800;padding:8px 11px;border-radius:14px}.stepdots{display:flex;justify-content:center;gap:7px;margin:8px 0 22px}.stepdots span{width:7px;height:7px;border-radius:99px;background:#e2e8e3}.stepdots span.on{width:24px;background:var(--ink)}.weekday-row{display:grid;grid-template-columns:repeat(7,1fr);gap:6px;margin:10px 0 18px}.weekday-row button{border:0;border-radius:13px;height:42px;background:#fff;color:var(--muted);font-size:13px;font-weight:700;cursor:pointer}.weekday-row button.selected{background:var(--ink);color:white}.time-card label,.payout-inputs label{display:flex;align-items:center;justify-content:space-between;font-weight:600;gap:10px}.time-card input,.payout-inputs input,.field input,.date-input{border:0;background:#f1f4f2;border-radius:12px;padding:10px 12px;color:var(--ink);font-weight:700}.hours-choice{margin-top:14px}.hours-choice strong{display:block;margin-bottom:10px}.segmented{display:grid;grid-template-columns:1fr 1fr;gap:7px;background:#edf1ee;padding:5px;border-radius:16px}.segmented button{border:0;background:transparent;border-radius:12px;padding:11px 8px;color:var(--muted);font-weight:800;cursor:pointer}.segmented button.selected{background:var(--surface);color:var(--ink);box-shadow:0 1px 4px rgba(18,36,25,.08)}.hours-choice small{display:block;color:var(--muted);font-size:12px;line-height:1.4;margin-top:9px}.payout-inputs label span{color:var(--muted);font-size:13px}.payout-inputs label input{width:70px;margin-left:auto;text-align:center}.divider{height:1px;background:var(--line);margin:16px 0}.info-pill{background:var(--green-soft);color:var(--green-dark);border-radius:15px;padding:11px 13px;font-size:13px;font-weight:700}.compact{margin-top:14px;display:grid;grid-template-columns:1fr auto;align-items:center;gap:2px 12px}.compact small{color:var(--muted)}.switch{width:50px;height:30px;border-radius:30px;background:var(--green);padding:3px;display:flex;justify-content:flex-end;grid-row:1/3;grid-column:2}.switch i{width:24px;height:24px;background:white;border-radius:50%}.speed-card>strong{display:block;font-size:44px;margin:7px 0 2px}.speed-card>b{color:var(--green-dark)}.rate-pair{display:grid;grid-template-columns:1fr 1fr;gap:14px}.rate-pair span{display:flex;flex-direction:column;gap:2px}.rate-pair small{color:var(--muted)}.start-choice{margin-top:14px;display:flex;flex-direction:column;gap:12px}.start-choice label{display:flex;gap:8px;align-items:center}.onboarding-footer{display:flex;gap:10px;margin-top:20px}.primary,.ghost,.danger{border:0;border-radius:17px;padding:16px 18px;font-weight:800;cursor:pointer}.primary{background:var(--ink);color:white;flex:1}.primary:disabled{opacity:.35}.ghost{background:#e7ece8;color:var(--ink)}.danger{background:#feeaea;color:#a42a2a;width:100%}.screen{min-height:calc(min(900px,100vh - 40px) - 120px);display:flex;flex-direction:column}.app-header{display:flex;justify-content:space-between;align-items:center}.brand{display:flex;align-items:center;gap:10px;font-size:20px}.logo{display:grid;place-items:center;background:var(--ink);color:white;width:34px;height:34px;border-radius:11px;font-weight:900}.tiny-meta{font-size:13px;color:var(--muted)}.hero{text-align:center;padding:64px 0 30px}.hero>span{font-size:10px;font-weight:800;letter-spacing:.1em;color:var(--muted)}.hero h1{font-size:47px;margin:10px 0 8px}.live-pill{display:inline-flex;padding:7px 12px;border-radius:14px;background:#eef1ef;color:var(--muted);font-size:13px;font-weight:800}.live-pill.live{background:var(--green-soft);color:var(--green-dark)}.hero small{display:block;margin-top:6px;color:var(--muted)}.today-card{min-height:215px;display:flex;flex-direction:column;justify-content:space-between}.row{display:flex;justify-content:space-between;align-items:center}.row.secondary{font-size:13px;color:var(--muted)}.green{color:var(--green-dark)}.progress{height:8px;border-radius:99px;background:#e9eeea;overflow:hidden}.progress i{display:block;height:100%;background:var(--green);border-radius:99px;transition:width .25s linear}.next-work{font-size:12px;color:var(--muted);padding-top:10px;border-top:1px solid var(--line)}.weekend-card{min-height:150px;justify-content:center;text-align:center;gap:10px}.weekend-card p{color:var(--muted);line-height:1.5}.next-payout{margin-top:12px;display:flex;justify-content:space-between;align-items:center}.next-payout div{display:flex;flex-direction:column;gap:4px}.next-payout div span{font-size:13px;color:var(--muted)}.next-payout em{font-style:normal;background:#eff2f0;border-radius:14px;padding:8px 10px;color:var(--muted);font-size:12px}.meeting-timer{margin-top:12px;display:grid;gap:13px}.meeting-timer-head{display:flex;justify-content:space-between;gap:12px;align-items:flex-start}.meeting-timer-head span{font-size:13px;color:var(--muted)}.meeting-timer-values{display:grid;grid-template-columns:1fr 1fr;gap:12px}.meeting-timer-values div{display:flex;flex-direction:column;gap:3px}.meeting-timer-values strong{font-size:22px}.meeting-timer-values small{font-size:11px;color:var(--muted)}.timer-button{width:100%;border:0;border-radius:15px;padding:13px 16px;background:var(--ink);color:white;font-weight:800;cursor:pointer}.timer-button.running{background:#edf1ee;color:var(--ink)}.timer-note{font-size:11px;line-height:1.4;color:var(--muted)}.bottom-rates{margin-top:auto;padding:24px 0 4px;display:grid;grid-template-columns:repeat(3,1fr);gap:6px}.bottom-rates span{text-align:center;display:flex;flex-direction:column}.bottom-rates b{font-size:12px}.bottom-rates small{font-size:10px;color:var(--muted);margin-top:3px}.payout-alert{margin-bottom:12px;border:1px solid #ccebd9}.payout-alert .eyebrow{color:var(--green-dark);font-weight:900}.payout-alert p{color:var(--muted);font-size:13px;margin-bottom:5px}.payout-alert>strong{display:block;font-size:25px;margin-bottom:14px}.payout-alert .primary{width:100%}.text-button{display:block;margin:8px auto 0;border:0;background:none;color:var(--muted);padding:8px;cursor:pointer}.page-header h1{margin-top:8px}.page-header p{color:var(--muted);line-height:1.45}.empty{margin-top:30px;text-align:center}.empty p{color:var(--muted);line-height:1.45}.history-list{display:flex;flex-direction:column;gap:10px}.history-list article{display:grid;gap:7px}.history-list article span,.history-list article small{color:var(--muted);font-size:13px}.history-list article strong{font-size:24px}.settings-form{display:flex;flex-direction:column;gap:12px}.field>label,.field.two label{color:var(--muted);font-size:13px;font-weight:700;display:flex;flex-direction:column;gap:8px}.field input{font-size:18px}.field.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}.math-note{font-size:12px;line-height:1.4;color:var(--muted);padding:4px}.tabbar{position:absolute;left:14px;right:14px;bottom:14px;background:rgba(255,255,255,.92);border:1px solid #edf1ee;border-radius:21px;padding:6px;display:grid;grid-template-columns:repeat(3,1fr);gap:4px}.tabbar button{border:0;background:transparent;color:var(--muted);padding:12px 5px;border-radius:15px;font-size:12px;font-weight:800;cursor:pointer}.tabbar button.active{background:var(--ink);color:white}.notice{font-size:12px;color:var(--muted);margin-top:10px;text-align:center}
@media(max-width:520px){.app-shell{padding:0}.phone{width:100%;min-height:100vh;border-radius:0;box-shadow:none}.screen{min-height:calc(100vh - 120px)}h1{font-size:38px}.hero{padding-top:54px}.hero h1{font-size:43px}}

.install-card{display:grid;gap:10px}.install-card p{margin:0;color:var(--muted);font-size:13px;line-height:1.45}.install-card .primary{width:100%}.install-steps{margin:0;padding-left:20px;color:var(--muted);font-size:13px;line-height:1.55}.install-ok{color:var(--green-dark);font-weight:800;font-size:13px}.offline-note{font-size:11px;color:var(--muted)}
@media(max-width:520px){.phone{padding-top:max(28px,env(safe-area-inset-top));padding-bottom:calc(92px + env(safe-area-inset-bottom));}.tabbar{bottom:max(14px,env(safe-area-inset-bottom));}}
@media(display-mode:standalone){body{background:var(--bg)}.app-shell{padding:0}.phone{width:100%;min-height:100vh;border-radius:0;box-shadow:none}}
</style>
</head>
<body>
<div id="app"></div>
<script>
(()=>{
'use strict';
const KEY='kapaet:state:v1';
const DEFAULT={salary:0,currency:'RUB',workDays:[1,2,3,4,5],workStart:'09:30',workEnd:'18:30',countedHours:9,payoutDays:[14,29]};
const DAYS=[{value:1,label:'Пн'},{value:2,label:'Вт'},{value:3,label:'Ср'},{value:4,label:'Чт'},{value:5,label:'Пт'},{value:6,label:'Сб'},{value:0,label:'Вс'}];
let state=load(); let page='home'; let onboardStep=1; let draftSettings=clone(DEFAULT); let startMode='today'; let lastPayout=isoDay(new Date());
const app=document.getElementById('app');
let deferredInstallPrompt=null;
function isStandalone(){return window.matchMedia('(display-mode: standalone)').matches||window.navigator.standalone===true}
function isIOS(){return /iphone|ipad|ipod/i.test(navigator.userAgent)}
window.addEventListener('beforeinstallprompt',e=>{e.preventDefault();deferredInstallPrompt=e;if(state&&page==='settings')render()});
window.addEventListener('appinstalled',()=>{deferredInstallPrompt=null;if(state&&page==='settings')render()});
function clone(x){return JSON.parse(JSON.stringify(x))}
function esc(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function load(){try{return JSON.parse(localStorage.getItem(KEY)||'null')}catch(e){return null}}
function save(){try{if(state)localStorage.setItem(KEY,JSON.stringify(state))}catch(e){}}
function clear(){try{localStorage.removeItem(KEY)}catch(e){}}
function parseTime(v){const [h,m]=v.split(':').map(Number);return {h,m}}
function minutesBetween(a,b){const x=parseTime(a),y=parseTime(b);return y.h*60+y.m-(x.h*60+x.m)}
function dailyHours(s){return Math.max(0,minutesBetween(s.workStart,s.workEnd)/60)}
function countedDailyHours(s){return Number(s.countedHours)===8?8:9}
function weeklyHours(s){return countedDailyHours(s)*s.workDays.length}
function averageMonthlyHours(s){return weeklyHours(s)*52/12}
function hourlyRate(s){const h=averageMonthlyHours(s);return h>0?s.salary/h:0}
function dailyTarget(s){return hourlyRate(s)*countedDailyHours(s)}
function liveHourlyRate(s){const windowHours=dailyHours(s);return windowHours>0?dailyTarget(s)/windowHours:0}
function minuteRate(s){return liveHourlyRate(s)/60}
function secondRate(s){return minuteRate(s)/60}
function atTime(date,hhmm){const {h,m}=parseTime(hhmm),d=new Date(date);d.setHours(h,m,0,0);return d}
function startOfDay(date){const d=new Date(date);d.setHours(0,0,0,0);return d}
function isWorkDay(date,s){return s.workDays.includes(date.getDay())}
function workWindow(date,s){return {start:atTime(date,s.workStart),end:atTime(date,s.workEnd)}}
function workingMsBetween(from,to,s){if(to<=from)return 0;let total=0,cursor=startOfDay(from),last=startOfDay(to);while(cursor<=last){if(isWorkDay(cursor,s)){const {start,end}=workWindow(cursor,s),a=Math.max(start.getTime(),from.getTime()),b=Math.min(end.getTime(),to.getTime());if(b>a)total+=b-a}cursor.setDate(cursor.getDate()+1)}return total}
function earnedBetween(from,to,s){return workingMsBetween(from,to,s)/3600000*liveHourlyRate(s)}
function todayEarned(now,periodStart,s){const today=startOfDay(now),from=new Date(Math.max(today.getTime(),periodStart.getTime()));return earnedBetween(from,now,s)}
function dayProgress(now,s){if(!isWorkDay(now,s))return 0;const {start,end}=workWindow(now,s);if(now<=start)return 0;if(now>=end)return 1;return (now-start)/(end-start)}
function workStatus(now,s){if(!isWorkDay(now,s))return 'weekend';const {start,end}=workWindow(now,s);if(now<start)return 'before';if(now>=end)return 'after';return 'working'}
function nextWorkStart(now,s){for(let i=0;i<14;i++){const d=new Date(now);d.setDate(now.getDate()+i);const {start}=workWindow(d,s);if(isWorkDay(d,s)&&start>now)return start}return now}
function validDateForMonth(y,m,d){const last=new Date(y,m+1,0).getDate();return new Date(y,m,Math.min(d,last),0,0,0,0)}
function nextPayoutDate(now,days){const c=[];for(let mo=0;mo<=2;mo++){const base=new Date(now.getFullYear(),now.getMonth()+mo,1);for(const day of days)c.push(validDateForMonth(base.getFullYear(),base.getMonth(),day))}const today=startOfDay(now).getTime();return c.sort((a,b)=>a-b).find(d=>d.getTime()>=today)}
function calendarDaysUntil(a,b){const x=Date.UTC(a.getFullYear(),a.getMonth(),a.getDate()),y=Date.UTC(b.getFullYear(),b.getMonth(),b.getDate());return Math.round((y-x)/86400000)}
function money(v,d=2){return new Intl.NumberFormat('ru-RU',{minimumFractionDigits:d,maximumFractionDigits:d}).format(v)+' ₽'}
function dateFmt(d,time=false){return new Intl.DateTimeFormat('ru-RU',time?{day:'numeric',month:'long',hour:'2-digit',minute:'2-digit'}:{day:'numeric',month:'long'}).format(d)}
function isoDay(d){return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`}
function dateFromInput(v){const [y,m,d]=v.split('-').map(Number);return new Date(y,m-1,d,0,0,0,0)}
function uid(){return (crypto&&crypto.randomUUID)?crypto.randomUUID():Date.now()+'-'+Math.random().toString(16).slice(2)}
function shell(inner,cls=''){return `<main class="app-shell"><div class="phone ${cls}">${inner}</div></main>`}
function dots(){return `<div class="stepdots">${[1,2,3,4].map(n=>`<span class="${n===onboardStep?'on':''}"></span>`).join('')}</div>`}
function weekdays(s,context){return `<div class="weekday-row">${DAYS.map(d=>`<button data-action="toggle-day" data-context="${context}" data-day="${d.value}" class="${s.workDays.includes(d.value)?'selected':''}">${d.label}</button>`).join('')}</div>`}
function renderOnboarding(){let body='';const s=draftSettings;
if(onboardStep===1)body=`<section><h1>Сколько ты<br>получаешь?</h1><p class="lead">Укажи месячный оклад. Мы просто распределим его по твоему рабочему времени.</p><div class="card input-card"><label>Оклад в месяц</label><div class="amount-input"><input id="salary" inputmode="numeric" value="${s.salary}"><span>₽</span></div></div><p class="caption">Без налогов, ФОТ и расчётных листков.</p></section>`;
if(onboardStep===2)body=`<section><h1>Когда ты<br>работаешь?</h1><p class="lead">Укажи рабочее окно и выбери, считать ли день за вычетом перерыва или целиком.</p><label class="section-label">Рабочие дни</label>${weekdays(s,'onboarding')}<div class="card time-card"><label>Начало <input id="workStart" type="time" step="1800" value="${s.workStart}"></label><div class="divider"></div><label>Конец <input id="workEnd" type="time" step="1800" value="${s.workEnd}"></label></div><div class="card hours-choice"><strong>Как считать рабочий день</strong><div class="segmented"><button type="button" data-action="counted-hours" data-hours="8" class="${countedDailyHours(s)===8?'selected':''}">8 часов</button><button type="button" data-action="counted-hours" data-hours="9" class="${countedDailyHours(s)===9?'selected':''}">9 часов</button></div><small>8 часов — за вычетом перерыва. 9 часов — весь рабочий интервал. Если выбраны 8 часов, счётчик всё равно идёт равномерно в течение всего рабочего окна.</small></div><div class="info-pill">${countedDailyHours(s)} расчётных ч/день · ${weeklyHours(s).toFixed(0)} ч/неделю</div></section>`;
if(onboardStep===3)body=`<section><h1>Когда тебе<br>платят?</h1><p class="lead">Даты нужны только для напоминания о сбросе счётчика.</p><div class="card payout-inputs"><label>Выплата №1 <input id="payout1" type="number" min="1" max="31" value="${s.payoutDays[0]}"><span>числа</span></label><div class="divider"></div><label>Выплата №2 <input id="payout2" type="number" min="1" max="31" value="${s.payoutDays[1]}"><span>числа</span></label></div><div class="card compact"><strong>Сбрасывать вручную</strong><span class="switch"><i></i></span><small>После фактической выплаты</small></div></section>`;
if(onboardStep===4)body=`<section><h1>Всё готово.</h1><p class="lead">Вот как быстро у тебя капает.</p><div class="card speed-card"><span class="caption">Твоя скорость</span><strong>${money(secondRate(s),3)}</strong><b>в секунду</b><div class="divider"></div><div class="rate-pair"><span><strong>${money(minuteRate(s))}</strong><small>в минуту</small></span><span><strong>${money(hourlyRate(s))}</strong><small>за расчётный час</small></span></div></div><div class="start-choice card"><strong>Откуда считать?</strong><label><input type="radio" name="startmode" value="today" ${startMode==='today'?'checked':''}> С сегодняшнего дня</label><label><input type="radio" name="startmode" value="date" ${startMode==='date'?'checked':''}> С даты последней выплаты</label>${startMode==='date'?`<input id="lastPayout" class="date-input" type="date" value="${lastPayout}">`:''}</div></section>`;
const footer=`<div class="onboarding-footer">${onboardStep>1?'<button class="ghost" data-action="back">Назад</button>':''}<button class="primary" data-action="next" ${s.workDays.length===0||dailyHours(s)<=0?'disabled':''}>${onboardStep<4?'Продолжить':'Начать считать'}</button></div>`;
app.innerHTML=shell(dots()+body+footer,'onboarding')}
function formatDuration(ms){const total=Math.max(0,Math.floor(ms/1000)),h=Math.floor(total/3600),m=Math.floor((total%3600)/60),sec=total%60;return h>0?`${String(h).padStart(2,'0')}:${String(m).padStart(2,'0')}:${String(sec).padStart(2,'0')}`:`${String(m).padStart(2,'0')}:${String(sec).padStart(2,'0')}`}
function timerSnapshot(now,s){const t=state.meetingTimer||null;if(!t)return {running:false,elapsedMs:0,earned:0,hasResult:false};let elapsed=Math.max(0,Number(t.elapsedMs)||0);if(t.running&&t.startedAt){const started=new Date(t.startedAt);if(!Number.isNaN(started.getTime()))elapsed+=Math.max(0,now.getTime()-started.getTime())}return {running:!!t.running,elapsedMs:elapsed,earned:elapsed/3600000*hourlyRate(s),hasResult:elapsed>0}}
function meetingTimerCard(now,s){const t=timerSnapshot(now,s);return `<div class="card meeting-timer"><div class="meeting-timer-head"><div><strong>Таймер встречи</strong><div class="timer-note">Считает по расчётной ставке и не влияет на общий заработок.</div></div><span>${t.running?'● идёт':'локально'}</span></div><div class="meeting-timer-values"><div><strong>${formatDuration(t.elapsedMs)}</strong><small>время</small></div><div><strong>${money(t.earned)}</strong><small>${t.running?'накапало':'заработано'}</small></div></div><button class="timer-button ${t.running?'running':''}" data-action="meeting-timer">${t.running?'Остановить таймер':'Запустить таймер'}</button></div>`}
function dashboard(){const now=new Date(),s=state.settings,start=new Date(state.periodStart),earned=earnedBetween(start,now,s),earnedToday=todayEarned(now,start,s),status=workStatus(now,s),progress=dayProgress(now,s),nextWork=nextWorkStart(now,s),nextPay=nextPayoutDate(now,s.payoutDays),days=calendarDaysUntil(now,nextPay),payoutToday=s.payoutDays.includes(now.getDate())&&state.payoutDismissedFor!==isoDay(now);let st='';if(status==='working')st=`● +${money(secondRate(s),3)} / сек`;if(status==='after')st='Рабочий день завершён';if(status==='before')st='Рабочий день ещё не начался';if(status==='weekend')st='Сегодня не капает';
return `<section class="screen home-screen"><header class="app-header"><div class="brand"><span class="logo">₽</span><strong>Капает</strong></div><span class="tiny-meta">${new Intl.DateTimeFormat('ru-RU',{hour:'2-digit',minute:'2-digit'}).format(now)}</span></header><div class="hero"><span>ЗАРАБОТАНО С ПОСЛЕДНЕЙ ВЫПЛАТЫ</span><h1>${money(earned)}</h1><div class="live-pill ${status==='working'?'live':''}">${st}</div>${status==='weekend'?'<small>Выходной</small>':''}</div>${payoutToday?`<div class="card payout-alert"><span class="eyebrow">Сегодня выплата</span><p>С последней выплаты заработано</p><strong>${money(earned)}</strong><button class="primary" data-action="receive-payout">Получено — начать новый период</button><button class="text-button" data-action="dismiss-payout">Не сейчас</button></div>`:''}${status==='weekend'?`<div class="card today-card weekend-card"><strong>Сегодня выходной</strong><p>Счётчик продолжит работу<br><b>${dateFmt(nextWork,true)}</b></p></div>`:`<div class="card today-card"><div class="row"><strong>Сегодня</strong><b class="green">+${money(earnedToday)}</b></div><div class="row secondary"><span>${status==='after'?'Рабочий день завершён':'Рабочий день'}</span><b>${Math.round(progress*100)}%</b></div><div class="progress"><i style="width:${progress*100}%"></i></div><div class="row secondary"><span>${esc(s.workStart)}</span><span>${esc(s.workEnd)}</span></div>${status==='after'?`<div class="next-work">Следующий рабочий день · <b>${dateFmt(nextWork,true)}</b></div>`:''}${status==='before'?`<div class="next-work">Начнётся сегодня · <b>${esc(s.workStart)}</b></div>`:''}</div>`}${meetingTimerCard(now,s)}<div class="card next-payout"><div><span>Следующая выплата</span><strong>${dateFmt(nextPay)}</strong></div><em>${days===0?'сегодня':`через ${days} дн.`}</em></div><div class="bottom-rates"><span><b>${money(hourlyRate(s))}</b><small>расчётный час</small></span><span><b>${money(minuteRate(s))}</b><small>минута дня</small></span><span><b>${money(secondRate(s),3)}</b><small>секунда дня</small></span></div></section>`}
function history(){return `<section class="screen"><header class="page-header"><h1>История</h1><p>Завершённые периоды сохраняются после подтверждения выплаты.</p></header>${state.history.length===0?'<div class="empty card"><strong>Пока пусто</strong><p>Первая запись появится, когда ты отметишь выплату как полученную.</p></div>':`<div class="history-list">${state.history.map(x=>`<article class="card"><span>${dateFmt(new Date(x.startedAt))} — ${dateFmt(new Date(x.endedAt))}</span><strong>${money(x.earned)}</strong><small>Выплачено ✓</small></article>`).join('')}</div>`}</section>`}
function installCard(){if(isStandalone())return `<div class="card install-card"><strong>Капает установлено ✓</strong><div class="install-ok">Открывается как отдельное приложение</div><div class="offline-note">После первого открытия основная версия доступна и без сети.</div></div>`;if(deferredInstallPrompt)return `<div class="card install-card"><strong>Установить Капает</strong><p>Добавь приложение на устройство — оно будет открываться отдельно от браузера.</p><button type="button" class="primary" data-action="install-pwa">Установить приложение</button></div>`;if(isIOS())return `<div class="card install-card"><strong>Добавить на экран iPhone</strong><p>В браузере открой меню «Поделиться», затем:</p><ol class="install-steps"><li>Нажми «На экран Домой»</li><li>Подтверди «Добавить»</li></ol><div class="offline-note">После установки «Капает» будет открываться без адресной строки, как приложение.</div></div>`;return `<div class="card install-card"><strong>Установить Капает</strong><p>Открой меню браузера и выбери «Установить приложение» или «Добавить на главный экран».</p></div>`}
function settings(){const s=state.settings;return `<section class="screen"><header class="page-header"><h1>Настройки</h1><p>Изменения применяются к расчёту после сохранения.</p></header><form class="settings-form" id="settingsForm">${installCard()}<div class="card field"><label>Оклад<input id="setSalary" type="number" value="${s.salary}"></label></div><div class="card field two"><label>Начало<input id="setStart" type="time" step="1800" value="${s.workStart}"></label><label>Конец<input id="setEnd" type="time" step="1800" value="${s.workEnd}"></label></div><div class="card hours-choice"><strong>Как считать рабочий день</strong><div class="segmented"><button type="button" data-action="counted-hours" data-context="settings" data-hours="8" class="${countedDailyHours(s)===8?'selected':''}">8 часов</button><button type="button" data-action="counted-hours" data-context="settings" data-hours="9" class="${countedDailyHours(s)===9?'selected':''}">9 часов</button></div><small>8 часов — за вычетом перерыва. 9 часов — весь рабочий интервал.</small></div><div class="card field two"><label>Выплата №1<input id="setP1" type="number" min="1" max="31" value="${s.payoutDays[0]}"></label><label>Выплата №2<input id="setP2" type="number" min="1" max="31" value="${s.payoutDays[1]}"></label></div><div class="card"><label class="section-label">Рабочие дни</label>${weekdays(s,'settings')}</div><div class="math-note">Расчётное рабочее время: ${averageMonthlyHours(s).toFixed(1)} ч/мес. Рабочее окно ${esc(s.workStart)}–${esc(s.workEnd)} используется для равномерного накопления суммы в течение дня.</div><button class="primary" type="submit">Сохранить</button><button class="danger" type="button" data-action="reset-all">Сбросить приложение</button></form></section>`}
function nav(){return `<nav class="tabbar"><button data-page="home" class="${page==='home'?'active':''}">Главная</button><button data-page="history" class="${page==='history'?'active':''}">История</button><button data-page="settings" class="${page==='settings'?'active':''}">Настройки</button></nav>`}
function render(){if(!state){renderOnboarding();return}app.innerHTML=shell((page==='home'?dashboard():page==='history'?history():settings())+nav())}
function syncOnboardingFields(){const el=id=>document.getElementById(id);if(el('salary'))draftSettings.salary=Number(el('salary').value.replace(/\D/g,''))||0;if(el('workStart'))draftSettings.workStart=el('workStart').value;if(el('workEnd'))draftSettings.workEnd=el('workEnd').value;if(el('payout1'))draftSettings.payoutDays[0]=Math.max(1,Math.min(31,Number(el('payout1').value)||1));if(el('payout2'))draftSettings.payoutDays[1]=Math.max(1,Math.min(31,Number(el('payout2').value)||1));if(el('lastPayout'))lastPayout=el('lastPayout').value}
app.addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;const action=b.dataset.action;if(b.dataset.page){page=b.dataset.page;render();return}if(action==='toggle-day'){const day=Number(b.dataset.day);const target=b.dataset.context==='onboarding'?draftSettings:state.settings;target.workDays=target.workDays.includes(day)?target.workDays.filter(x=>x!==day):[...target.workDays,day];if(state)save();render();return}if(action==='counted-hours'){const target=b.dataset.context==='settings'?state.settings:draftSettings;target.countedHours=Number(b.dataset.hours)===8?8:9;if(state&&b.dataset.context==='settings')save();render();return}if(action==='back'){syncOnboardingFields();onboardStep--;render();return}if(action==='next'){syncOnboardingFields();if(onboardStep<4){onboardStep++;render()}else{const now=new Date(),periodStart=startMode==='today'?startOfDay(now):dateFromInput(lastPayout);state={settings:clone(draftSettings),periodStart:periodStart.toISOString(),history:[]};save();page='home';render()}return}if(action==='meeting-timer'){const now=new Date(),t=state.meetingTimer;if(t&&t.running){const started=new Date(t.startedAt),base=Math.max(0,Number(t.elapsedMs)||0),extra=Number.isNaN(started.getTime())?0:Math.max(0,now.getTime()-started.getTime());state.meetingTimer={running:false,startedAt:null,elapsedMs:base+extra,stoppedAt:now.toISOString()}}else{state.meetingTimer={running:true,startedAt:now.toISOString(),elapsedMs:0,stoppedAt:null}}save();render();return}if(action==='receive-payout'){const now=new Date(),earned=earnedBetween(new Date(state.periodStart),now,state.settings);state.history.unshift({id:uid(),startedAt:state.periodStart,endedAt:now.toISOString(),earned});state.periodStart=now.toISOString();state.payoutDismissedFor=isoDay(now);save();render();return}if(action==='dismiss-payout'){state.payoutDismissedFor=isoDay(new Date());save();render();return}if(action==='install-pwa'){if(deferredInstallPrompt){deferredInstallPrompt.prompt();deferredInstallPrompt.userChoice.finally(()=>{deferredInstallPrompt=null;if(state&&page==='settings')render()})}return}if(action==='reset-all'){if(confirm('Сбросить все настройки и историю?')){clear();state=null;draftSettings=clone(DEFAULT);onboardStep=1;page='home';render()}}});
app.addEventListener('change',e=>{if(e.target.name==='startmode'){startMode=e.target.value;syncOnboardingFields();render()}});
app.addEventListener('submit',e=>{if(e.target.id!=='settingsForm')return;e.preventDefault();const s=state.settings;s.salary=Number(document.getElementById('setSalary').value)||0;s.workStart=document.getElementById('setStart').value;s.workEnd=document.getElementById('setEnd').value;s.payoutDays=[Math.max(1,Math.min(31,Number(document.getElementById('setP1').value)||1)),Math.max(1,Math.min(31,Number(document.getElementById('setP2').value)||1))];save();render()});
if('serviceWorker' in navigator&&location.protocol!=='file:'){window.addEventListener('load',()=>{navigator.serviceWorker.register('./sw.js').catch(()=>{})})}
setInterval(()=>{if(state&&page==='home')render()},250);
render();
})();
</script>
</body>
</html>
